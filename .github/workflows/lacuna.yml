name: Lacuna checks

on:
  push:
    paths:
      - 'apps/lacuna-web/**'
      - 'contracts/lacuna.py'
      - 'tests/direct/test_lacuna.py'
      - 'tests/direct/conftest.py'
      - 'requirements-lacuna.txt'
      - 'scripts/*lacuna*.py'
      - '.github/workflows/lacuna.yml'
  pull_request:
    paths:
      - 'apps/lacuna-web/**'
      - 'contracts/lacuna.py'
      - 'tests/direct/test_lacuna.py'
      - 'tests/direct/conftest.py'
      - 'requirements-lacuna.txt'
      - 'scripts/*lacuna*.py'
      - '.github/workflows/lacuna.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lacuna.txt
      - run: python scripts/prepare_gltest_runner.py
      - run: genvm-lint check contracts/lacuna.py
      - run: python -m pytest tests/direct/test_lacuna.py -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/lacuna-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --prod --audit-level=high
