name: MicroWagers web release gate

on:
  pull_request:
    paths:
      - "apps/microwagers-web/**"
      - ".github/workflows/microwagers-web.yml"
  push:
    branches: [main]
    paths:
      - "apps/microwagers-web/**"
      - ".github/workflows/microwagers-web.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/microwagers-web
    env:
      NEXT_PUBLIC_MICROWAGERS_ADDRESS: 0x5D2679a7277D05E5bE9a6Bf60526D0fC7C1d477C
      NEXT_PUBLIC_NETWORK_NAME: StudioNet
      NEXT_PUBLIC_SITE_URL: https://microwagers.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/microwagers-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high
