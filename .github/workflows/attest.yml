name: ATTEST checks

on:
  push:
    paths:
      - "contracts/attest.py"
      - "tests/direct/test_attest.py"
      - "apps/attest-web/**"
      - "scripts/deploy_attest.py"
      - "scripts/attest_acceptance.py"
      - "scripts/check_attest_release.py"
      - ".github/workflows/attest.yml"
  pull_request:
    paths:
      - "contracts/attest.py"
      - "tests/direct/test_attest.py"
      - "apps/attest-web/**"
      - "scripts/deploy_attest.py"
      - "scripts/attest_acceptance.py"
      - "scripts/check_attest_release.py"
      - ".github/workflows/attest.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-deploy.txt
      - run: python scripts/prepare_gltest_runner.py
      - run: genvm-lint check contracts/attest.py
      - run: pytest tests/direct/test_attest.py -q
      - run: python -m compileall -q scripts/deploy_attest.py scripts/attest_acceptance.py scripts/check_attest_release.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/attest-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
