<!DOCTYPE html>
<html lang="en">
<!--
  MicroWagers — peer-to-peer micro-wager resolver on GenLayer StudioNet

  Run locally (no build step):
      cd frontend && python -m http.server 8080
      open http://localhost:8080

  Deploy to Vercel (pure static — Studio's CORS policy allows direct calls):
      cd frontend && vercel --prod
      (or drag the frontend folder onto vercel.com/new)

  Uses an ephemeral gasless account persisted in localStorage (StudioNet is gasless).
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroWagers â€” AI-resolved bets on GenLayer</title>
<script type="module">
  import { createClient, createAccount } from "https://esm.sh/genlayer-js@latest";
  import { studionet } from "https://esm.sh/genlayer-js@latest/chains";
  import { TransactionStatus } from "https://esm.sh/genlayer-js@latest/types";

  const DEFAULT_CONTRACT = "0xAD9dcf5CAB3756A739D9E25C3E6DF92b03C121cf";
  const WEI = 10n ** 18n;

  // Studio's CORS policy is permissive (echoes any Origin, allows POST +
  // content-type preflight), so browsers call studio.genlayer.com directly
  // from any host — localhost, vercel.app, or elsewhere.
  const chainForEnv = () => studionet;

  let client = null;
  let account = null;
  let contractAddress = localStorage.getItem("mw_contract") || DEFAULT_CONTRACT;

  const $ = (id) => document.getElementById(id);
  const fmtGEN = (atto) => {
    try {
      const v = BigInt(atto);
      const whole = v / WEI;
      const frac = ((v % WEI) * 1000n) / WEI;
      return frac > 0n ? `${whole}.${frac.toString().padStart(3, "0")} GEN` : `${whole} GEN`;
    } catch { return atto + " atto"; }
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const short = (a) => a ? a.slice(0, 6) + "â€¦" + a.slice(-4) : "";

  function toast(msg, isErr = false) {
    const el = document.createElement("div");
    el.className = "toast" + (isErr ? " err" : "");
    el.textContent = msg;
    $("toasts").appendChild(el);
    setTimeout(() => el.remove(), isErr ? 8000 : 4000);
  }

  async function ensureAccount() {
    let account = null;
    const savedKey = localStorage.getItem("mw_key");
    if (savedKey) {
      try {
        const cand = createAccount(savedKey);
        if (cand && cand.address && (!cand.privateKey || cand.privateKey.toLowerCase() === String(savedKey).toLowerCase())) {
          account = cand;
        }
      } catch { /* fall through to fresh identity */ }
    }
    if (!account) {
      account = createAccount();
      localStorage.setItem("mw_key", account.privateKey);
    }
    client = createClient({ chain: chainForEnv(), account });
    $("you").textContent = short(account.address);
    $("you").title = account.address;
  }

  function resetAccount() {
    localStorage.removeItem("mw_key");
    ensureAccount().then(() => toast("New identity generated"));
    refresh();
  }

  async function read(fn, args) {
    return client.readContract({ address: contractAddress, functionName: fn, args });
  }

  async function write(fn, args, valueAtto = 0n, label = "") {
    toast(label ? label + ": sending txâ€¦" : "Sending txâ€¦");
    const hash = await client.writeContract({
      address: contractAddress, functionName: fn, args,
      value: valueAtto,
    });
    toast("Tx " + hash.slice(0, 10) + "â€¦ submitted, waiting for consensusâ€¦");
    await client.waitForTransactionReceipt({ hash, status: TransactionStatus.ACCEPTED });
    toast(label ? label + " confirmed" : "Tx confirmed");
    return hash;
  }

  const STATUS_CLASS = { OPEN: "st-open", LIVE: "st-live", RESOLVED: "st-resolved", SETTLED: "st-settled", VOIDED: "st-void" };

  function actionsHTML(w) {
    if (!account) return "";
    const me = account.address.toLowerCase();
    const nowSec = Math.floor(Date.now() / 1000);
    const pastDeadline = nowSec > Number(w.deadline_unix);
    const isCreator = w.creator.toLowerCase() === me;
    const isTaker = w.taker.toLowerCase() === me;
    const isWinner = w.winner.toLowerCase() === me;
    const btns = [];

    if (w.status === "OPEN" && !isCreator) {
      btns.push(`<button data-act="accept" data-id="${w.id}">Accept Â· stake ${fmtGEN(w.stake_atto)}</button>`);
    }
    if (w.status === "LIVE" && pastDeadline) {
      btns.push(`<button data-act="resolve" data-id="${w.id}">Resolve via AI jury</button>`);
    }
    if (w.status === "LIVE" && !pastDeadline) {
      btns.push(`<span class="hint">resolves after ${new Date(Number(w.deadline_unix) * 1000).toLocaleString()}</span>`);
    }
    if (w.status === "RESOLVED") {
      const windowEnds = Number(w.resolved_at_unix) + 3 * 86400;
      if (nowSec < windowEnds && !w.appealed && !isWinner) {
        btns.push(`<details class="appeal"><summary class="button-as">Appeal (bond ${fmtGEN(w.stake_atto)})</summary>
          <textarea id="stmt-${w.id}" maxlength="800" placeholder="Why is this verdict wrong?"></textarea>
          <button data-act="appeal" data-id="${w.id}">Submit appeal</button></details>`);
      }
      if (isWinner) {
        btns.push(`<button data-act="claim" data-id="${w.id}" class="primary">Claim ${fmtGEN(w.pot_atto)}</button>`);
      }
      if (!w.appealed && nowSec < windowEnds) {
        const left = Math.max(0, Math.floor((windowEnds - nowSec) / 3600));
        btns.push(`<span class="hint">appeal window: ${left}h left</span>`);
      }
    }
    if (w.status === "VOIDED") btns.push(`<span class="hint">refunded â€” matter undeterminable</span>`);
    if (w.status === "SETTLED") btns.push(`<span class="hint">paid out</span>`);
    return btns.join("");
  }

  function cardHTML(w) {
    let verdict = "";
    if (["RESOLVED", "SETTLED"].includes(w.status)) {
      verdict = `
        <div class="verdict"><b>Verdict:</b> ${esc(w.outcome_label)}</div>
        <div class="reason">${esc(w.verdict_reason)}</div>
        <div class="meta">confidence bucket ${esc(w.confidence_bucket)}/100 Â· resolved ${w.resolved_at_iso ? new Date(w.resolved_at_iso).toLocaleString() : ""}${w.appealed ? ` Â· <b class="ap">APPEALED</b>` : ""}</div>`;
    }
    const stmt = w.appeal_statement ? `<div class="meta">challenger: â€œ${esc(w.appeal_statement)}â€</div>` : "";
    return `
    <div class="card">
      <div class="row1">
        <span class="pill ${STATUS_CLASS[w.status] || ""}">${w.status}</span>
        <span class="wid">${esc(w.id)}</span>
        <span class="pot">pot ${fmtGEN(w.pot_atto)}</span>
      </div>
      <div class="q">${esc(w.question)}</div>
      <div class="sides">
        <span>A: ${esc(w.creator_side)} <i>(${short(w.creator)})</i></span>
        <span>B: ${esc(w.taker_side)} <i>${w.taker && w.status !== "OPEN" ? "(" + short(w.taker) + ")" : "(open to accept)"}</i></span>
      </div>
      ${w.source_url ? `<div class="src">source: <a href="${esc(w.source_url)}" target="_blank" rel="noopener">${esc(w.source_url)}</a></div>` : ""}
      ${verdict}${stmt}
      <div class="actions">${actionsHTML(w)}</div>
    </div>`;
  }

  async function refresh() {
    contractAddress = ($("contract").value || DEFAULT_CONTRACT).trim();
    localStorage.setItem("mw_contract", contractAddress);
    try {
      const [stats, listing] = await Promise.all([
        read("get_stats", []),
        read("list_wagers", [0, 100]),
      ]);
      $("stats").textContent =
        `${stats.total_created} created Â· ${stats.total_settled} settled`;
      const items = [...listing.items].reverse();
      const detailed = await Promise.all(items.map(i => read("get_wager", [i.id])));
      $("wagers").innerHTML = detailed.map(cardHTML).join("") ||
        `<p class="empty">No wagers yet â€” create the first one.</p>`;
    } catch (e) {
      toast("Read failed: " + e.message, true);
    }
  }

  document.addEventListener("click", async (ev) => {
    const b = ev.target.closest("button[data-act]");
    if (!b || b.disabled) return;
    const id = b.dataset.id;
    b.disabled = true;
    try {
      if (b.dataset.act === "accept") {
        const w = await read("get_wager", [id]);
        await write("accept_wager", [id], BigInt(w.stake_atto), "Accept");
      }
      else if (b.dataset.act === "resolve") await write("resolve_wager", [id], 0n, "Resolve");
      else if (b.dataset.act === "claim") await write("claim", [id], 0n, "Claim");
      else if (b.dataset.act === "appeal") {
        const stmt = $("stmt-" + id).value.trim();
        if (!stmt) throw new Error("write a challenge statement first");
        const w = await read("get_wager", [id]);
        await write("appeal_wager", [id, stmt], BigInt(w.stake_atto), "Appeal");
      }
      await refresh();
    } catch (e) {
      toast(e.message || String(e), true);
      b.disabled = false;
    }
  }, true);

  $("createForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const q = $("q").value.trim();
    const a = $("sideA").value.trim();
    const bs = $("sideB").value.trim();
    const url = $("url").value.trim();
    const dlLocal = $("deadline").value;
    const stakeGEN = parseFloat($("stakeInput").value || "0");
    if (!q || !a || !bs) return toast("fill question and both sides", true);
    if (a.toLowerCase() === bs.toLowerCase()) return toast("sides must differ", true);
    if (!(stakeGEN > 0)) return toast("stake must be > 0", true);
    if (!dlLocal) return toast("pick a deadline", true);
    const deadline = Math.floor(new Date(dlLocal).getTime() / 1000);
    if (deadline <= Math.floor(Date.now() / 1000) + 60)
      return toast("deadline must be â‰¥ ~2 min in the future", true);
    try {
      await write(
        "create_wager", [q, a, bs, url, deadline],
        BigInt(Math.round(stakeGEN * 1e15)), "Create wager"
      );
      $("createForm").reset();
      await refresh();
    } catch (e) { toast(e.message || String(e), true); }
  });

  $("refresh").addEventListener("click", refresh);
  $("resetId").addEventListener("click", resetAccount);

  ensureAccount().then(refresh);
  setInterval(refresh, 30000);
</script>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e;
          --acc:#7c3aed; --ok:#238636; --warn:#9e6a03; --bad:#b62324; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,Segoe UI,sans-serif; padding:24px; max-width:860px; margin:0 auto; }
  h1 { font-size:1.45rem; letter-spacing:-.02em; } h1 span { color:var(--acc); }
  .sub { color:var(--dim); margin-bottom:16px; font-size:.9rem; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:18px; font-size:.85rem; }
  .bar input { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; width:340px; font-family:ui-monospace,monospace; font-size:.8rem; }
  .badge { background:#1f6feb33; color:#79c0ff; border-radius:99px; padding:2px 10px; font-weight:600; }
  button, .button-as { background:#21262d; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:7px 12px; cursor:pointer; font-size:.85rem; }
  button:hover, .button-as:hover { border-color:var(--acc); }
  button.primary { background:var(--ok); border-color:var(--ok); font-weight:600; }
  button:disabled { opacity:.45; cursor:wait; }
  form.new { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; display:grid; gap:10px; margin-bottom:20px; }
  form.new textarea, form.new input { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; width:100%; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid4 { display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:10px; align-items:end; }
  label { font-size:.78rem; color:var(--dim); display:block; margin-bottom:4px; }
  .stats { color:var(--dim); font-size:.85rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  .row1 { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
  .pill { border-radius:99px; padding:1px 10px; font-size:.75rem; font-weight:700; letter-spacing:.04em; }
  .st-open{background:#1f6feb33;color:#79c0ff}.st-live{background:#bb800933;color:#e3b341}
  .st-resolved{background:#23863633;color:#56d364}.st-settled{background:#23863655;color:#7ee787}
  .st-void{background:#b6232433;color:#ff7b72}
  .wid{color:var(--dim);font-family:ui-monospace,monospace;font-size:.8rem}
  .pot{margin-left:auto;font-weight:600;font-size:.85rem}
  .q{font-weight:600;margin-bottom:8px}
  .sides{display:flex;flex-direction:column;gap:2px;color:#c9d1d9;font-size:.88rem}
  .sides i{color:var(--dim);font-style:normal;font-family:ui-monospace,monospace;font-size:.78rem}
  .src,.meta{color:var(--dim);font-size:.8rem;margin-top:6px;word-break:break-all}
  .src a{color:#58a6ff}
  .verdict{margin-top:8px;font-size:.92rem;color:#56d364}
  .reason{color:var(--dim);font-size:.85rem;margin-top:4px;border-left:2px solid var(--line);padding-left:10px}
  .ap{color:#e3b341}
  .actions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .hint{color:var(--dim);font-size:.8rem}
  details.appeal{position:relative}
  details.appeal textarea{width:100%;min-height:60px;margin:8px 0;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;display:block}
  .empty{color:var(--dim);text-align:center;padding:30px}
  #toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:9}
  .toast{background:var(--card);border:1px solid var(--acc);border-radius:8px;padding:10px 14px;font-size:.85rem;max-width:380px;animation:pop .2s ease-out}
  .toast.err{border-color:var(--bad);color:#ffa198}
  @keyframes pop{from{transform:translateY(8px);opacity:0}}
  @media(max-width:640px){.grid2,.grid4{grid-template-columns:1fr}}
</style>
</head>
<body>
  <header>
    <div>
      <h1>Micro<span>Wagers</span></h1>
      <div class="sub">Bet on anything with plain-English terms. AI validators judge reality. The contract pays.</div>
    </div>
    <span class="badge">GenLayer StudioNet Â· gasless</span>
  </header>

  <div class="bar">
    <b>Contract:</b><input id="contract" spellcheck="false">
    <span class="stats" id="stats"></span>
    <span style="margin-left:auto"></span>
    <span>you: <code id="you"></code></span>
    <button id="resetId" title="Generate a fresh gasless identity">New identity</button>
    <button id="refresh">Refresh</button>
  </div>

  <form class="new" id="createForm">
    <div><label>Wager question / resolution criteria (plain English)</label>
      <textarea id="q" rows="2" maxlength="500" placeholder="Will Team X win the grand final? Judged from https://... at deadline." required></textarea></div>
    <div class="grid2">
      <div><label>Side A (yours) wins ifâ€¦</label><input id="sideA" maxlength="80" placeholder="Team X wins" required></div>
      <div><label>Side B wins ifâ€¦</label><input id="sideB" maxlength="80" placeholder="Team X does not win" required></div>
    </div>
    <div class="grid4">
      <div style="grid-column:span 2"><label>Evidence source URL (optional but recommended)</label><input id="url" type="url" placeholder="https://example.com/results"></div>
      <div><label>Resolution deadline</label><input id="deadline" type="datetime-local" required></div>
      <div><label>Stake (GEN)</label><input id="stakeInput" type="number" min="0.001" step="0.001" value="0.01" required></div>
    </div>
    <div><button type="submit" class="primary">Post wager</button></div>
  </form>

  <div id="wagers"><p class="empty">Loading wagersâ€¦</p></div>
  <div id="toasts"></div>
</body>
</html>
